services:
  - type: web
    name: solar-lead-mvp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: NOMINATIM_CONTACT_EMAIL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENCAGE_API_KEY
        sync: false
      - key: OPENCAGE_DAILY_REQUEST_LIMIT
        value: "1500"